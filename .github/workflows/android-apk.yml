name: Build Android APK

on:
  push:
    branches: [arena/27d33b38-resistor-color-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
      - name: Generate Android runner
        run: flutter create --platforms=android --project-name resistor_color_app .
      - name: Install dependencies
        run: flutter pub get
      - name: Build debug APK
        run: |
          if ! flutter build apk --debug > apk-build.log 2>&1; then
            cat apk-build.log
            grep -i -A 4 -B 1 'error\|failed\|exception' apk-build.log | head -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: resistor-studio-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
